[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnueron"
version = "0.3.2"
description = "Python SDK for the mnueron memory backend (hosted at mnueron.com)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "mnueron", email = "khemlall.mangal@gmail.com"}]
keywords = ["ai", "memory", "agents", "llm", "mcp", "claude", "mnueron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25,<1.0",
]

[project.urls]
Homepage = "https://www.mnueron.com"
Documentation = "https://www.mnueron.com/docs"
Source = "https://github.com/randi2160/mnueron"
Issues = "https://github.com/randi2160/mnueron/issues"

[tool.setuptools]
py-modules = ["mnueron"]
