[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnueron"
version = "0.1.0"
description = "Python SDK for the mnueron memory backend"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
keywords = ["ai", "memory", "agents", "llm", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25,<1.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/mnueron"
Documentation = "https://github.com/yourorg/mnueron#readme"
Source = "https://github.com/yourorg/mnueron"
Issues = "https://github.com/yourorg/mnueron/issues"

[tool.setuptools]
py-modules = ["mnueron"]
