<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>mnueron · memory dashboard</title>
<style>
  /* ─── reset / base ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #d6dae3;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea {
    font: inherit;
    color: inherit;
  }
  button { cursor: pointer; }
  a { color: #7aa2ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ─── layout ───────────────────────────────────────────────────────── */
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  .sidebar {
    background: #0a0c10;
    border-right: 1px solid #1f2330;
    padding: 18px 14px;
    overflow-y: auto;
  }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .toolbar {
    padding: 14px 22px;
    border-bottom: 1px solid #1f2330;
    display: flex;
    gap: 12px;
    align-items: center;
    background: #0f1115;
  }
  .list { flex: 1; overflow-y: auto; padding: 4px 0 32px; }

  /* ─── sidebar ──────────────────────────────────────────────────────── */
  .brand {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin: 0 4px 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #5cffb0; box-shadow: 0 0 6px #5cffb0; }
  .stats {
    margin: 14px 4px 22px;
    padding: 12px;
    background: #131722;
    border: 1px solid #1f2330;
    border-radius: 8px;
  }
  .stats .row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 13px; }
  .stats .row .k { color: #8a92a6; }
  .stats .row .v { color: #d6dae3; font-variant-numeric: tabular-nums; }

  .nslabel {
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #6c7488;
    margin: 6px 4px;
  }
  .ns {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: #c4cad6;
    margin-bottom: 1px;
  }
  .ns:hover { background: #161a26; }
  .ns.active { background: #1d2230; color: #fff; }
  .ns .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ns .count {
    font-size: 12px;
    color: #6c7488;
    background: #11141c;
    border-radius: 10px;
    padding: 1px 8px;
    margin-left: 8px;
  }
  .ns.active .count { color: #d6dae3; }

  /* ─── toolbar ──────────────────────────────────────────────────────── */
  .search {
    flex: 1;
    background: #161a26;
    border: 1px solid #232938;
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    min-width: 0;
    outline: none;
    transition: border-color .15s;
  }
  .search:focus { border-color: #3a5cf0; }
  .scope {
    color: #8a92a6;
    font-size: 13px;
    white-space: nowrap;
  }
  .btn {
    background: #1d2230;
    color: #d6dae3;
    border: 1px solid #232938;
    border-radius: 8px;
    padding: 8px 14px;
    transition: background .15s;
  }
  .btn:hover { background: #232938; }
  .btn.primary { background: #3a5cf0; border-color: #3a5cf0; color: #fff; }
  .btn.primary:hover { background: #4a6bff; }

  /* ─── memory rows ──────────────────────────────────────────────────── */
  .empty {
    color: #6c7488;
    padding: 80px 22px;
    text-align: center;
    font-size: 14px;
  }
  .row {
    padding: 14px 22px;
    border-bottom: 1px solid #1a1e2b;
    cursor: pointer;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 12px;
    align-items: start;
  }
  .row:hover { background: #11141c; }
  .row.expanded { background: #11141c; }
  .row .meta {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    font-size: 12px;
    color: #8a92a6;
    align-items: center;
  }
  .row .preview {
    grid-column: 1;
    color: #d6dae3;
    line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .row.expanded .preview {
    -webkit-line-clamp: unset;
    display: block;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row .actions { grid-column: 2; display: flex; gap: 6px; }
  .tag {
    background: #1d2230;
    color: #9fa9bf;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    text-transform: lowercase;
  }
  .ns-pill {
    background: #1a2440;
    color: #9bb1f0;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
  }
  .score-pill {
    background: #1a3024;
    color: #7be0a8;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #6c7488;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  .delete-btn:hover { background: #3a1a1f; color: #ff8088; }
  .id-snippet { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #6c7488; }

  /* ─── drop overlay ─────────────────────────────────────────────────── */
  .drop-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 17, 21, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    border: 3px dashed #3a5cf0;
  }
  .drop-overlay.show { display: flex; }
  .drop-overlay .msg {
    color: #fff;
    font-size: 18px;
    text-align: center;
  }
  .drop-overlay .msg .sub { color: #8a92a6; font-size: 13px; margin-top: 6px; }

  /* ─── toast ────────────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 22px; right: 22px;
    background: #1d2230;
    border: 1px solid #2a3142;
    border-radius: 8px;
    padding: 12px 16px;
    color: #d6dae3;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transform: translateY(20px);
    opacity: 0;
    transition: all .25s;
    pointer-events: none;
    max-width: 380px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.err { border-color: #5a2530; color: #ffa6b0; }
  .toast.ok  { border-color: #2a5a3a; color: #a6ffc4; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> mnueron</div>

    <div class="stats" id="stats">
      <div class="row"><span class="k">total memories</span><span class="v" id="stat-total">–</span></div>
      <div class="row"><span class="k">namespaces</span><span class="v" id="stat-ns">–</span></div>
      <div class="row"><span class="k">last activity</span><span class="v" id="stat-latest">–</span></div>
    </div>

    <div class="nslabel">namespaces</div>
    <div id="ns-list"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <input class="search" id="search" type="text" placeholder="Search memories…" autocomplete="off" />
      <span class="scope" id="scope">all namespaces</span>
      <button class="btn" id="import-btn">Import…</button>
      <input type="file" id="import-file" accept=".json" style="display:none" />
    </div>

    <div class="list" id="list">
      <div class="empty">Loading…</div>
    </div>
  </main>
</div>

<div class="drop-overlay" id="drop">
  <div class="msg">
    Drop a Claude or ChatGPT export <code>.json</code> here
    <div class="sub">Auto-detects format. Imports into the "imported" namespace.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ─── state ────────────────────────────────────────────────────────────
  const state = {
    namespace: null,    // null = all
    query: '',
    memories: [],
    namespaces: [],
    expanded: new Set(),
  };

  // ─── api ──────────────────────────────────────────────────────────────
  async function api(path, opts) {
    const r = await fetch(path, opts);
    if (!r.ok) {
      let msg = `${r.status} ${r.statusText}`;
      try { const j = await r.json(); if (j.error) msg = j.error; } catch {}
      throw new Error(msg);
    }
    return r.json();
  }

  // ─── render ───────────────────────────────────────────────────────────
  function fmtDate(ts) {
    if (!ts) return '–';
    const d = new Date(ts);
    const now = Date.now();
    const diff = now - ts;
    if (diff < 60_000) return 'just now';
    if (diff < 3_600_000) return Math.floor(diff/60_000) + 'm ago';
    if (diff < 86_400_000) return Math.floor(diff/3_600_000) + 'h ago';
    if (diff < 604_800_000) return Math.floor(diff/86_400_000) + 'd ago';
    return d.toISOString().slice(0, 10);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',
    }[c]));
  }

  async function loadStats() {
    try {
      const s = await api('/api/stats');
      document.getElementById('stat-total').textContent = s.total;
      document.getElementById('stat-ns').textContent = s.namespaces;
      document.getElementById('stat-latest').textContent = fmtDate(s.latest);
    } catch (e) { toast('stats: ' + e.message, 'err'); }
  }

  async function loadNamespaces() {
    try {
      const list = await api('/api/namespaces');
      state.namespaces = list;
      renderNamespaces();
    } catch (e) { toast('namespaces: ' + e.message, 'err'); }
  }

  function renderNamespaces() {
    const root = document.getElementById('ns-list');
    const items = [
      { name: '__all__', count: state.namespaces.reduce((s, n) => s + n.count, 0), label: 'all namespaces' },
      ...state.namespaces.map(n => ({ ...n, label: n.name })),
    ];
    root.innerHTML = items.map(n => {
      const active = (n.name === '__all__' && state.namespace === null) || n.name === state.namespace;
      return `<div class="ns ${active ? 'active' : ''}" data-ns="${escapeHtml(n.name)}">
        <span class="name">${escapeHtml(n.label)}</span>
        <span class="count">${n.count}</span>
      </div>`;
    }).join('');
    root.querySelectorAll('.ns').forEach(el => {
      el.addEventListener('click', () => {
        const v = el.getAttribute('data-ns');
        state.namespace = (v === '__all__') ? null : v;
        renderNamespaces();
        document.getElementById('scope').textContent = state.namespace || 'all namespaces';
        loadMemories();
      });
    });
  }

  async function loadMemories() {
    const q = state.query.trim();
    const params = new URLSearchParams();
    if (state.namespace) params.set('namespace', state.namespace);
    if (q) params.set('q', q);
    params.set('limit', '100');
    try {
      const list = await api('/api/memories?' + params.toString());
      state.memories = list;
      renderList();
    } catch (e) {
      document.getElementById('list').innerHTML = `<div class="empty">error: ${escapeHtml(e.message)}</div>`;
    }
  }

  function renderList() {
    const root = document.getElementById('list');
    if (state.memories.length === 0) {
      root.innerHTML = `<div class="empty">${state.query ? 'No matches.' : 'No memories yet.'}</div>`;
      return;
    }
    root.innerHTML = state.memories.map(m => {
      const expanded = state.expanded.has(m.id);
      const score = (typeof m.score === 'number') ? `<span class="score-pill">${m.score.toFixed(2)}</span>` : '';
      const tags = (m.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join(' ');
      return `<div class="row ${expanded ? 'expanded' : ''}" data-id="${escapeHtml(m.id)}">
        <div class="preview">${escapeHtml(m.content)}</div>
        <div class="actions">
          <button class="delete-btn" data-del="${escapeHtml(m.id)}" title="Delete">✕</button>
        </div>
        <div class="meta">
          <span class="ns-pill">${escapeHtml(m.namespace)}</span>
          ${tags}
          ${score}
          <span>${fmtDate(m.created_at)}</span>
          <span class="id-snippet">${escapeHtml(m.id.slice(0, 8))}</span>
        </div>
      </div>`;
    }).join('');
    root.querySelectorAll('.row').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.matches('.delete-btn')) return;
        const id = el.getAttribute('data-id');
        if (state.expanded.has(id)) state.expanded.delete(id);
        else state.expanded.add(id);
        renderList();
      });
    });
    root.querySelectorAll('.delete-btn').forEach(el => {
      el.addEventListener('click', async e => {
        e.stopPropagation();
        const id = el.getAttribute('data-del');
        if (!confirm('Delete this memory?')) return;
        try {
          await api('/api/memories/' + encodeURIComponent(id), { method: 'DELETE' });
          toast('Deleted.', 'ok');
          await Promise.all([loadMemories(), loadNamespaces(), loadStats()]);
        } catch (err) { toast('delete failed: ' + err.message, 'err'); }
      });
    });
  }

  // ─── import ───────────────────────────────────────────────────────────
  async function importFile(file) {
    try {
      const text = await file.text();
      // sniff format client-side just to set a reasonable default namespace label
      const ns = prompt('Import into namespace:', 'imported') || 'imported';
      toast(`Reading ${file.name}…`);
      const res = await api('/api/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: text, namespace: ns }),
      });
      toast(`Imported ${res.saved} memories (${res.format}) into "${res.namespace}".`, 'ok');
      await Promise.all([loadMemories(), loadNamespaces(), loadStats()]);
    } catch (e) { toast('import failed: ' + e.message, 'err'); }
  }

  // ─── toast ────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg, kind = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + kind;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast ' + kind; }, 3500);
  }

  // ─── events ───────────────────────────────────────────────────────────
  const searchEl = document.getElementById('search');
  let searchTimer;
  searchEl.addEventListener('input', () => {
    state.query = searchEl.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadMemories, 250);
  });

  document.getElementById('import-btn').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) importFile(f);
    e.target.value = '';
  });

  // drag-drop
  const drop = document.getElementById('drop');
  let dragCounter = 0;
  window.addEventListener('dragenter', e => {
    e.preventDefault(); dragCounter++; drop.classList.add('show');
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', e => {
    e.preventDefault(); dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) drop.classList.remove('show');
  });
  window.addEventListener('drop', e => {
    e.preventDefault(); dragCounter = 0; drop.classList.remove('show');
    const f = e.dataTransfer.files[0];
    if (f && f.name.endsWith('.json')) importFile(f);
    else toast('Drop a .json export file.', 'err');
  });

  // ─── boot ─────────────────────────────────────────────────────────────
  loadStats();
  loadNamespaces();
  loadMemories();

  // refresh stats every 30s in case something else writes
  setInterval(loadStats, 30_000);
</script>
</body>
</html>
